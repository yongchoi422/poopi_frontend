<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SOULI — A little room</title>
  <link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e9e2d6;color:#352d25;font-family:Arial,sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #527982;outline-offset:3px}
    main{max-width:1280px;margin:30px auto;padding:0 24px}.product{background:#faf6ed;border-radius:18px;overflow:hidden;box-shadow:0 12px 48px #4c352010}header{display:flex;gap:24px;align-items:center;min-height:72px;padding:0 28px}.brand{font:700 32px Georgia,serif;letter-spacing:-1.7px}.brand span{color:#b25f42}.tagline{margin-left:auto;font-size:10px;letter-spacing:2px}.time{font-size:12px;display:flex;align-items:center;gap:8px}.time:before{content:'';width:6px;height:6px;border-radius:50%;background:#be8d48}
    .stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#c3b094}.stage canvas{width:100%;height:100%;display:block}.soul{position:absolute;transform:translate(-50%,-100%);pointer-events:none;transform-origin:50% 100%}.soul svg{width:100%;height:100%;display:block;overflow:visible}.status{position:absolute;bottom:22px;left:28px;color:#fff1d5;text-shadow:0 1px 4px #29170a;font-size:12px;pointer-events:none}.status:before{content:'•';color:#f1c873;margin-right:8px}footer{display:flex;justify-content:space-between;align-items:center;gap:18px;min-height:90px;padding:18px 28px}.soul-control{display:flex;align-items:center;gap:12px}.avatar{width:44px;height:44px;background:#5d4a38;border-radius:50%;padding:7px}.avatar svg{width:100%;height:100%}label{display:block;font-size:11px;color:#7e6b56}select{background:transparent;border:0;color:#352d25;padding:7px 16px 7px 0;font-size:14px;min-height:40px}.small{font-size:11px;color:#7e6b56}.actions{display:flex;gap:8px}button{border:0;border-radius:25px;min-height:44px;padding:11px 18px;background:#e9dfd0;color:#352d25;font-size:12px}.primary{background:#3a2e24;color:#fff5e6}.lab{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:16px 0 0;font-size:12px;color:#685843}.lab-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lab button{background:transparent;border:1px solid #cdbfae;font-size:11px;min-height:36px;padding:8px 13px}.lab button[aria-pressed=true]{background:#534433;color:#fff5e6;border-color:#534433}.lab .hint{font-size:11px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#eee5d6}.loading[hidden]{display:none}.playing .soul{animation:inspect 2.8s ease-in-out}@keyframes inspect{0%,100%{transform:translate(-50%,-100%) rotate(0)}32%,60%{transform:translate(-43%,-100%) rotate(6deg)}80%{transform:translate(-50%,-100%) rotate(-2deg)}}@media(prefers-reduced-motion:reduce){.playing .soul{animation:none}}
    @media(max-width:600px){main{margin:12px auto;padding:0 12px}header{padding:0 18px;min-height:62px}.tagline{display:none}.time{margin-left:auto;font-size:11px}.stage{aspect-ratio:1/1.04}footer{padding:15px 18px;flex-wrap:wrap}.actions{width:100%}.actions button{flex:1}.status{left:18px;bottom:18px;font-size:11px}.lab{gap:10px}.lab .hint{width:100%}}
  </style>
  <style>
    .appearance{margin-top:18px;padding:19px 22px;background:#f6f0e5;border:1px solid #d8cbb7;border-radius:15px}.appearance-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.appearance-title{font-size:13px;font-weight:600}.appearance-switch{display:flex;gap:5px}.appearance-switch button{min-height:40px;background:transparent;border:1px solid #cbbda9;padding:9px 15px}.appearance-switch button[aria-pressed=true]{background:#4b3e2f;color:#fff5e7;border-color:#4b3e2f}.shape-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin:17px 0 0;padding:0;border:0;min-width:0}.shape-controls label{font-size:12px;color:#594936;display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.shape-controls input{width:100%;margin:0;accent-color:#816849;min-height:30px}.shape-controls:disabled{opacity:.45}.shape-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.shape-actions button{min-height:38px;padding:8px 13px;background:#e9dfcf;font-size:11px}.shape-actions button[aria-pressed=true]{background:#534433;color:#fff5e6}.shape-note{font-size:11px;color:#806e56;margin-left:auto;line-height:1.6}.appearance output{font-variant-numeric:tabular-nums;color:#66533c}.soul[hidden]{display:none}.lab .hint{max-width:100%}
    @media(max-width:600px){.appearance{padding:15px}.appearance-title{width:100%}.shape-controls{grid-template-columns:1fr;gap:10px;margin-top:15px}.shape-controls input{min-height:36px}.shape-note{margin-left:0;width:100%}.appearance-switch{width:100%}.appearance-switch button{flex:1;min-height:44px}.shape-actions button{min-height:44px}.shape-controls label{font-size:12px}.shape-actions{gap:6px}}
  </style>
  <script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<main>
  <div class="product">
    <header><span class="brand">souli<span>.</span></span><span class="tagline">A LITTLE PLACE OF YOUR OWN</span><span class="time">A slow afternoon</span></header>
    <div class="stage" aria-label="SOULI miniature room"><div class="soul"></div><span class="status" aria-live="polite">Taking the coffee break very seriously.</span><div class="loading">Opening the little room…</div></div>
    <footer><div class="soul-control"><span class="avatar"></span><div><label for="soul-select">At home. All on its own.</label><select id="soul-select" aria-label="Original soul"></select></div></div><div class="actions"><button type="button" id="keep">Keep this</button><button type="button" id="moment" class="primary">A little moment ↗</button></div></footer>
  </div>
  <section class="appearance" aria-label="소울 입체화 비교">
    <div class="appearance-head"><span class="appearance-title">내 소울의 모습</span><div class="appearance-switch" aria-label="표현 방식"><button type="button" id="flat-mode" aria-pressed="false">원본 도트 · 2D</button><button type="button" id="volume-mode" aria-pressed="true">입체 소울 · 3D</button></div></div>
    <fieldset class="shape-controls" aria-label="입체 소울 모양">
      <div><label for="soul-depth">두께 <output id="depth-value">4.0</output></label><input id="soul-depth" type="range" min="0.6" max="8" step="0.2" value="4" aria-label="소울 두께"></div>
      <div><label for="soul-roundness">모서리 둥글기 <output id="roundness-value">14%</output></label><input id="soul-roundness" type="range" min="0" max="28" step="2" value="14" aria-label="모서리 둥글기"></div>
      <div><label for="soul-angle">돌려보기 <output id="angle-value">−24°</output></label><input id="soul-angle" type="range" min="-180" max="180" step="1" value="-24" aria-label="소울 회전 각도"></div>
    </fieldset>
    <div class="shape-actions"><button type="button" id="front-view">정면 보기</button><button type="button" id="close-view" aria-pressed="false">소울 가까이</button><button type="button" id="export-soul">소울 GLB 저장</button><span class="shape-note">앞모습은 원본 도트 · 옆과 뒤는 두께를 준 표현</span></div>
  </section>
  <div class="lab"><div class="lab-group"><button type="button" id="game-view" aria-pressed="true">게임 화면</button><button type="button" id="model-view" aria-pressed="false">3D 모델 둘러보기</button><button type="button" id="light-toggle" aria-pressed="false">저녁 조명</button></div><span class="hint">방 모델 v2 · 소울 입체화 실험</span><div class="lab-group"><button type="button" id="export">방 GLB 저장</button></div></div>
</main>
<script type="module" src="./preview.mjs"></script>
